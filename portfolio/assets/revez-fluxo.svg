<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="842" viewBox="0 0 1120 842" role="img" aria-labelledby="title desc">
  <title id="title">Revez. Da revisão ao comunicado no Slack</title>
  <desc id="desc">Fluxo validado no ensaio DASH-003. O Make confere identidade, permissão e versão e registra a mudança no Google Sheets. A revisora pede um ajuste. O analista recebe o parecer e envia a entrega corrigida. A revisora aprova a entrega e registra a publicação simulada. A gestora autoriza o comunicado em mensagem direta, e o Revez envia uma única resposta na thread privada de teste. Em um ensaio separado de consulta, quem tinha acesso recebeu o status e a próxima ação. A conta sem acesso recebeu uma resposta neutra sem leitura da planilha.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; fill: #251d34; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #634090; }
      .heading { font-size: 24px; font-weight: 700; }
      .card-title { font-size: 21px; font-weight: 700; }
      .role { font-size: 14px; font-weight: 700; letter-spacing: .45px; fill: #634090; }
      .body { font-size: 18px; fill: #494157; }
      .detail { font-size: 16px; fill: #494157; }
      .green { fill: #285c49; }
      .arrow { fill: none; stroke: #7152a0; stroke-width: 2.3; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m2 1 6 4-6 4" fill="none" stroke="#7152a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="slack" viewBox="0 0 48 48">
      <path d="M18 5a4 4 0 1 0-4 4h4zM5 12h13a4 4 0 0 1 0 8H5a4 4 0 0 1 0-8z" fill="#36c5f0"/>
      <path d="M24 5a4 4 0 0 1 8 0v13a4 4 0 0 1-8 0zM39 14a4 4 0 1 1 0 8h-4v-4a4 4 0 0 1 4-4z" fill="#2eb67d"/>
      <path d="M43 26a4 4 0 0 1 0 8H30a4 4 0 0 1 0-8zM30 43a4 4 0 1 0 4-4h-4z" fill="#ecb22e"/>
      <path d="M5 26a4 4 0 1 0 4 4v-4zM16 26a4 4 0 0 1 4 4v13a4 4 0 0 1-8 0V30a4 4 0 0 1 4-4z" fill="#e01e5a"/>
    </symbol>
    <symbol id="make" viewBox="0 0 48 48">
      <path d="M3 35 15 10l8 4-12 25z" fill="#d737ce"/>
      <path d="m16 36 8-26 9 3-8 26z" fill="#a723d0"/>
      <rect x="35" y="10" width="9" height="29" rx="1.5" fill="#6b22c8"/>
    </symbol>
    <symbol id="sheets" viewBox="0 0 48 48">
      <path d="M10 3h20l10 10v28a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z" fill="#168756"/>
      <path d="M30 3v10h10" fill="#7bd4a2"/>
      <path d="M14 20h18v15H14z M14 27.5h18 M23 20v15" fill="none" stroke="#fff" stroke-width="2.2"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 32 32">
      <path d="M9 14v-4a7 7 0 0 1 14 0v4" fill="none" stroke="#634090" stroke-width="3"/>
      <rect x="6" y="13" width="20" height="15" rx="3" fill="#634090"/>
      <circle cx="16" cy="20.5" r="2" fill="#fff"/>
    </symbol>
    <symbol id="thread" viewBox="0 0 32 32">
      <path d="M4 5h24v17H14l-6 5v-5H4z" fill="#285c49"/>
      <path d="M9 11h14M9 16h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1120" height="842" rx="20" fill="#faf7fb"/>
  <rect x="34" y="35" width="7" height="88" rx="3.5" fill="#7650a6"/>
  <text x="57" y="51" class="eyebrow">REVEZ · FLUXO VALIDADO</text>
  <text x="56" y="93" font-size="40" font-weight="700">Da revisão ao comunicado no Slack</text>
  <text x="57" y="122" class="body">DASH-003 · Painel de SLA de Atendimento · dados fictícios</text>

  <g transform="translate(34 153)">
    <rect width="248" height="109" rx="13" fill="#fff" stroke="#dfd4e8"/>
    <use href="#slack" x="15" y="14" width="32" height="32"/>
    <text x="58" y="37" class="heading">Slack</text>
    <text x="17" y="70" class="detail">Comandos e avisos</text>
    <text x="17" y="93" class="detail">na DM do Revez.</text>
  </g>
  <path d="M287 207h22" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(314 153)">
    <rect width="425" height="109" rx="13" fill="#f0e9f8" stroke="#dfd4e8"/>
    <use href="#make" x="15" y="12" width="37" height="37"/>
    <text x="60" y="37" class="heading">Make valida a ação</text>
    <text x="17" y="70" class="detail">Confere identidade, permissão e versão.</text>
    <text x="17" y="93" class="detail">Bloqueia repetições.</text>
  </g>
  <path d="M744 207h22" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(771 153)">
    <rect width="315" height="109" rx="13" fill="#fff" stroke="#cddfd4"/>
    <use href="#sheets" x="15" y="12" width="37" height="37"/>
    <text x="60" y="37" class="heading">Google Sheets</text>
    <text x="17" y="70" class="detail">Registra estado, versão, link</text>
    <text x="17" y="93" class="detail">e confirmação do envio.</text>
  </g>

  <rect x="34" y="286" width="1052" height="226" rx="15" fill="#f0e9f8" stroke="#e1d4ec"/>
  <use href="#lock" x="51" y="302" width="28" height="28"/>
  <text x="88" y="324" class="eyebrow">ACOMPANHAMENTO POR DM</text>

  <g transform="translate(51 344)">
    <rect width="239" height="147" rx="11" fill="#fff" stroke="#dfd4e8"/>
    <text x="15" y="28" class="role">REVISORA → ANALISTA</text>
    <text x="15" y="63" class="card-title">Ajuste solicitado</text>
    <text x="15" y="98" class="detail">Devolve a entrega.</text>
    <text x="15" y="121" class="detail">Parecer vai ao analista.</text>
  </g>
  <path d="M293 419h16" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(314 344)">
    <rect width="239" height="147" rx="11" fill="#fff" stroke="#dfd4e8"/>
    <text x="15" y="28" class="role">ANALISTA → REVISORA</text>
    <text x="15" y="63" class="card-title">Entrega corrigida</text>
    <text x="15" y="98" class="detail">Envia o link atualizado.</text>
    <text x="15" y="121" class="detail">A revisora recebe o aviso.</text>
  </g>
  <path d="M556 419h16" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(577 344)">
    <rect width="239" height="147" rx="11" fill="#fff" stroke="#dfd4e8"/>
    <text x="15" y="28" class="role">REVISORA</text>
    <text x="15" y="63" class="card-title">Aprovação</text>
    <text x="15" y="98" class="detail">Aprova a entrega corrigida.</text>
    <text x="15" y="121" class="detail">A próxima ação é publicar.</text>
  </g>
  <path d="M819 419h16" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(840 344)">
    <rect width="229" height="147" rx="11" fill="#fff" stroke="#dfd4e8"/>
    <text x="15" y="28" class="role">REVISORA · SIMULAÇÃO</text>
    <text x="15" y="63" class="card-title">Publicação</text>
    <text x="15" y="98" class="detail">Registra o link publicado</text>
    <text x="15" y="121" class="detail">no ambiente de teste.</text>
  </g>

  <rect x="34" y="531" width="1052" height="166" rx="15" fill="#eaf3ee" stroke="#cddfd4"/>
  <use href="#thread" x="51" y="544" width="28" height="28"/>
  <text x="88" y="565" class="eyebrow green">COMUNICADO NA THREAD DO TIME</text>
  <g transform="translate(51 582)">
    <rect width="474" height="96" rx="11" fill="#fff" stroke="#cddfd4"/>
    <text x="17" y="33" class="card-title">A gestora autoriza por DM</text>
    <text x="17" y="64" class="detail">Libera o aviso após a publicação simulada.</text>
  </g>
  <path d="M531 631h30" class="arrow" marker-end="url(#arrowhead)"/>
  <g transform="translate(567 582)">
    <rect width="502" height="96" rx="11" fill="#fff" stroke="#cddfd4"/>
    <text x="17" y="33" class="card-title">O Revez publica uma única resposta</text>
    <text x="17" y="64" class="detail">O aviso inclui o link do painel simulado na thread privada.</text>
  </g>

  <rect x="34" y="716" width="1052" height="92" rx="13" fill="#fff" stroke="#dfd4e8"/>
  <text x="52" y="747" class="eyebrow">CONSULTA POR DM · ENSAIO DASH-002</text>
  <text x="52" y="780" class="detail">
    <tspan font-weight="700">Com acesso</tspan><tspan> · Estado, próxima ação, responsável e link.</tspan>
  </text>
  <path d="M552 761v24" stroke="#dfd4e8"/>
  <text x="575" y="780" class="detail">
    <tspan font-weight="700">Sem acesso</tspan><tspan> · Resposta neutra, sem ler a planilha.</tspan>
  </text>
</svg>
