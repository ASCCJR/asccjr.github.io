name: EvidentGraph evidence evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence-graph/core/evaluation/**'
      - 'evidence-graph/core/lab-runtime/**'
      - 'evidence-graph/preview-m2/**'
      - '.github/workflows/evidentgraph-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing laboratory dependencies
        run: python -m pip install -r evidence-graph/core/lab-runtime/requirements.txt
      - name: Previous laboratory and history regressions
        working-directory: evidence-graph/core/lab-runtime
        run: python -m unittest -v test_lab test_adapter test_capture_history test_auth
      - name: Behavioral reference, source ablation and metrics
        working-directory: evidence-graph/core/evaluation
        run: python -m unittest -v test_experiment
