name: EvidentGraph preview data
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'evidence-graph/preview-m2/**'
      - 'evidence-graph/core/demo-ui/**'
      - 'evidence-graph/core/demo-data/**'
      - '.github/workflows/evidentgraph-preview-data.yml'
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m2-review-preview-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Validate reference model and traversal
        run: |
          cd evidence-graph/core/demo-data
          python3 -m unittest -q test_model
          cd ../demo-ui
          node --test test_exploration.cjs
      - name: Build the static evaluation dataset
        run: python3 evidence-graph/core/demo-ui/build_preview.py
      - name: Commit generated assets to the evaluation branch only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add -f evidence-graph/preview-m2/data.js evidence-graph/preview-m2/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(preview): include reproducible static dataset'
          git push origin "HEAD:$HEAD_BRANCH"
